<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Input — Title + Description</title>

  <!-- Quill CSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

  <style>
    body{
      margin:0; padding:24px;
      background:#f6f7f9;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
      display:flex; justify-content:center;
    }

    .task-form{
      width:min(720px, 95vw);
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .field-label{
      font-size:14px;
      font-weight:500;
      color:#444;
      margin-bottom:6px;
    }

    /* Title box */
    .title-box{
      width:100%;
      background:#fff;
      border:1px solid #ddd;
      border-radius:12px;
      padding:12px 14px;
      font-size:16px;
      box-shadow:0 2px 6px rgba(0,0,0,.05);
    }
    .title-box:focus{
      outline:none;
      border-color:#1a73e8;
      box-shadow:0 4px 12px rgba(26,115,232,.2);
    }

    /* Description wrapper */
    #editor-wrapper{
      position:relative;
      background:#fff;
      border:1px solid #ddd;
      border-radius:12px;
      box-shadow:0 2px 6px rgba(0,0,0,.05);
      overflow:hidden;
      transition:padding-top .35s ease;
      padding-top:0;
      width:100%;
    }
    #editor-wrapper.toolbar-open{ padding-top:44px; }

    /* Toolbar styling */
    #toolbar{
      position:absolute;
      top:0; left:0; right:0;
      height:44px;
      background:#fff;
      border-bottom:1px solid #eee;
      transform-origin:100% 0%;
      transform:scaleX(0);
      opacity:0;
      transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
      z-index:5;
    }
    #toolbar.show{
      transform:scaleX(1);
      opacity:1;
    }
    .ql-toolbar.ql-snow{ border:none; }
    .ql-container.ql-snow{ border:none; }

    /* Editor */
    #editor-container{
      min-height:120px;
      padding:12px 14px 18px;
      font-size:15px;
      line-height:1.5;
      color:#333;
    }

    /* Floating circular hamburger */
    .hamburger{
      position:absolute; top:8px; right:8px;
      width:40px; height:40px;
      border-radius:50%;
      background:#1a73e8;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
      z-index:10;
      transition:background .25s;
    }
    .hamburger:hover{ background:#0c56c9; }

    .hamburger .line{
      position:absolute;
      width:20px; height:2px;
      background:#fff; border-radius:2px;
      left:50%; transform:translateX(-50%);
      transition:transform .25s, opacity .2s;
    }
    .hamburger .line.top{ top:calc(50% - 6px); }
    .hamburger .line.mid{ top:50%; }
    .hamburger .line.bot{ top:calc(50% + 6px); }

    .hamburger.active .line.top{
      top:50%; transform:translateX(-50%) rotate(45deg);
    }
    .hamburger.active .line.mid{ opacity:0; }
    .hamburger.active .line.bot{
      top:50%; transform:translateX(-50%) rotate(-45deg);
    }
  </style>
</head>
<body>

  <div class="task-form">
    <!-- Title field -->
    <div class="field">
      <div class="field-label">Title</div>
      <input type="text" class="title-box" placeholder="Enter task title">
    </div>

    <!-- Description field -->
    <div class="field">
      <div class="field-label">Description</div>

      <div id="editor-wrapper">
        <!-- Floating hamburger -->
        <div class="hamburger" id="toggle-btn">
          <span class="line top"></span>
          <span class="line mid"></span>
          <span class="line bot"></span>
        </div>

        <!-- Toolbar -->
        <div id="toolbar">
          <select class="ql-header">
            <option value="1">Heading 1</option>
            <option value="2">Heading 2</option>
            <option selected>Normal</option>
          </select>
          <button class="ql-bold"></button>
          <button class="ql-italic"></button>
          <button class="ql-underline"></button>
          <button class="ql-list" value="ordered"></button>
          <button class="ql-list" value="bullet"></button>
          <button class="ql-clean"></button>
        </div>

        <!-- Editor -->
        <div id="editor-container"></div>
      </div>
    </div>
  </div>

  <!-- Quill JS -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script>
    const quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: { toolbar: '#toolbar' },
      placeholder: "Enter task description"
    });

    const wrapper = document.getElementById('editor-wrapper');
    const toolbar = document.getElementById('toolbar');
    const toggle  = document.getElementById('toggle-btn');

    toggle.addEventListener('click', () => {
      const open = !toolbar.classList.contains('show');
      toolbar.classList.toggle('show', open);
      wrapper.classList.toggle('toolbar-open', open);
      toggle.classList.toggle('active', open);
    });
  </script>

</body>
</html>
